<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Admin Panel - Protected Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .login-box { max-width: 420px; margin: 100px auto; background: #1e293b; border-radius: 16px; padding: 30px; border: 1px solid #334155; }
        .admin-content { display: none; }
        .img-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Protected Password Prompt -->
    <div class="login-box text-center shadow-lg" id="loginBox">
        <i class="fa-solid fa-user-shield fa-4x text-info mb-3"></i>
        <h3 class="fw-bold text-white">IOIS Admin Login</h3>
        <p class="text-muted small">Enter Security Password</p>
        <div class="mb-3">
            <input type="password" id="adminPassInput" class="form-control text-center fs-5" placeholder="Enter Password">
        </div>
        <button class="btn btn-info w-100 fw-bold" onclick="verifyAdmin()">Login To Admin Desk</button>
        <p class="text-danger mt-2 small d-none" id="errorMsg">Incorrect Password!</p>
    </div>

    <!-- Admin Panel Control Desk -->
    <div class="container py-5 admin-content" id="adminDesk">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <h2 class="fw-bold text-info"><i class="fa-solid fa-sliders me-2"></i>IOIS Admin Banner & Photo Manager</h2>
            <button class="btn btn-outline-danger" onclick="location.reload()">Logout</button>
        </div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="bg-dark p-4 rounded border border-secondary">
                    <h4 class="fw-bold text-warning mb-3">Add Banner Photo URL (Max 15)</h4>
                    <p class="small text-muted">PostImages.org ya ImgBB par photo upload karke Direct Link paste karein.</p>
                    <div class="mb-3">
                        <label class="form-label">Image Direct URL:</label>
                        <input type="url" id="imgUrlInput" class="form-control bg-secondary text-light" placeholder="https://i.ibb.co/example.jpg">
                    </div>
                    <button class="btn btn-success w-100 fw-bold" onclick="addBannerPhoto()">Add Photo To Slider</button>
                </div>
            </div>

            <div class="col-md-7">
                <div class="bg-dark p-4 rounded border border-secondary">
                    <h4 class="fw-bold text-info mb-3">Active Slider Images (<span id="photoCount">0</span>/15)</h4>
                    <div class="row g-3" id="photoGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Encrypted Base64 Key for IOISSYSTEM
        const SEC_KEY = "SU9JU1NZU1RFTQ=="; 

        function verifyAdmin() {
            const input = document.getElementById("adminPassInput").value;
            if (btoa(input) === SEC_KEY) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("adminDesk").style.display = "block";
                loadPhotos();
            } else {
                document.getElementById("errorMsg").classList.remove("d-none");
            }
        }

        function loadPhotos() {
            const photos = JSON.parse(localStorage.getItem("iois_banner_photos") || "[]");
            const grid = document.getElementById("photoGrid");
            document.getElementById("photoCount").innerText = photos.length;
            grid.innerHTML = "";

            photos.forEach((url, index) => {
                const col = document.createElement("div");
                col.className = "col-6 col-md-4 text-center";
                col.innerHTML = `
                    <div class="position-relative border border-secondary rounded p-1">
                        <img src="${url}" class="img-preview mb-2">
                        <button class="btn btn-danger btn-sm w-100" onclick="deletePhoto(${index})">Delete</button>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        function addBannerPhoto() {
            const url = document.getElementById("imgUrlInput").value.trim();
            let photos = JSON.parse(localStorage.getItem("iois_banner_photos") || "[]");

            if (!url) { alert("Enter valid image URL"); return; }
            if (photos.length >= 15) { alert("Maximum 15 photos allowed."); return; }

            photos.push(url);
            localStorage.setItem("iois_banner_photos", JSON.stringify(photos));
            document.getElementById("imgUrlInput").value = "";
            loadPhotos();
            alert("Photo Added to Carousel Slider!");
        }

        function deletePhoto(index) {
            let photos = JSON.parse(localStorage.getItem("iois_banner_photos") || "[]");
            photos.splice(index, 1);
            localStorage.setItem("iois_banner_photos", JSON.stringify(photos));
            loadPhotos();
        }
    </script>
</body>
</html>
