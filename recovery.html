<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOIS Password Recovery</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-config.js"></script></head><body class="min-h-screen bg-gray-950 text-white flex items-center justify-center p-5"><div class="w-full max-w-md bg-gray-900 border border-amber-500/20 rounded-3xl p-7"><div class="text-center"><img src="assets/logo.png" class="w-20 h-20 mx-auto object-contain" alt="IOIS Logo"><h1 class="text-2xl font-black mt-3">Forgot Password</h1><p class="text-gray-400 text-sm mt-2">Registered email पर reset link भेजें।</p></div><form id="f" class="space-y-4 mt-7"><input id="email" type="email" required autocomplete="email" placeholder="Registered email" class="w-full rounded-xl bg-gray-800 border border-gray-700 p-3.5"><button class="w-full rounded-xl bg-amber-400 text-gray-950 p-3.5 font-black" id="b">Send Reset Link</button><p id="m" class="text-sm text-center"></p></form><a href="login.html" class="block text-center mt-5 text-amber-400 font-bold">Back to Login</a></div><script>const c=window.ioisSupabase||window.supabase.createClient(window.IOIS_SUPABASE_URL,window.IOIS_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');f.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();b.disabled=true;b.textContent='Sending...';try{const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;m.textContent='Reset link आपके registered email पर भेज दिया गया है।';m.className='text-sm text-center text-emerald-400';}catch(err){m.textContent=err.message||'Reset request failed.';m.className='text-sm text-center text-red-400';}finally{b.disabled=false;b.textContent='Send Reset Link';}});</script></body></html>
