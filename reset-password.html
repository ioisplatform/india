<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IOIS | Reset Password</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-config.js"></script>
<style>body{background:#030712;color:#fff;font-family:Arial,sans-serif}.card{background:rgba(15,23,42,.9);border:1px solid rgba(245,158,11,.25);border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,.45)}input{background:#111827;border:1px solid #374151;color:#fff;width:100%;padding:13px 14px;border-radius:12px;outline:none}button{width:100%;padding:13px;border-radius:12px;font-weight:800;background:#f59e0b;color:#111827}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">
<div class="card w-full max-w-md p-7">
<div class="text-center mb-6"><img src="assets/logo.png" alt="IOIS Logo" class="w-20 h-20 mx-auto object-contain"><h1 class="text-xl font-black mt-3">Password Reset</h1><p class="text-gray-400 text-sm mt-1">नया password सेट करें</p></div>
<form id="reset-form" class="space-y-4">
<input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="New password" required>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Confirm new password" required>
<button id="save" type="submit">Update Password</button>
<div id="msg" class="text-sm text-center"></div>
</form></div>
<script>
const client=window.ioisSupabase || window.supabase.createClient(window.IOIS_SUPABASE_URL,window.IOIS_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('reset-form'),msg=document.getElementById('msg'),btn=document.getElementById('save');
function say(t,ok=false){msg.textContent=t;msg.className='text-sm text-center '+(ok?'text-emerald-400':'text-red-400');}
form.addEventListener('submit',async e=>{e.preventDefault(); const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8)return say('Password कम से कम 8 characters का होना चाहिए।');if(p!==c)return say('Passwords match नहीं करते।');btn.disabled=true;btn.textContent='Updating...';try{const {data:{session}}=await client.auth.getSession();if(!session)return say('Reset link expired है। नया reset link लें।');const {error}=await client.auth.updateUser({password:p});if(error)throw error;say('Password successfully updated. अब Login करें।',true);setTimeout(()=>location.href='login.html',1200);}catch(err){say(err.message||'Password update नहीं हो सका।');}finally{btn.disabled=false;btn.textContent='Update Password';}});
</script>
</body></html>
